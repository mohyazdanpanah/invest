openapi: 3.0.3

info:
  title: Investment Instruction API
  version: 1.0.0
  description: |
    API for submitting investment instructions and retrieving
    their current financial processing status. The instruction endpoints do not expose
    generated orders, trades, or per-asset execution details.

    ## Conventions

    - **Monetary unit.** Every monetary value in this API (`amount`,
      `price`, `lastMarketPrice`, `cashBalance`,
      `investmentValue`) is an integer number of **Iranian Rial (IRR)**.
      Toman is never used.
    - **Money identity.** For an account, `investmentValue`
      equals `cashBalance` plus the sum of `quantity × lastMarketPrice` over
      its assets.
    - **Timestamps.** All `date-time` values, in requests and responses,
      are ISO 8601 in **UTC** (suffix `Z`). They are not in Tehran local
      time, even though the market operates on Tehran time.
    - **Identifiers.** `instructionBatchId` groups a batch, and each
      `instructionId` is unique across all clients.
      `investmentId` is assigned by the client when the account is created.

    ## Asynchronous processing

    Instructions are submitted through `POST /instructions/batch` and are
    executed asynchronously. A `PENDING` result means the individual
    instruction was accepted and stored; it does not mean execution has
    completed. No push mechanism (webhooks or callbacks) exists. Clients
    track each accepted instruction with `GET /instructions/{instructionId}`
    until it reaches a terminal status (`COMPLETED`,
    `PARTIALLY_COMPLETED`, or `FAILED`).

    ## Instruction status lifecycle

    | Status | Meaning | Terminal |
    |---|---|---|
    | `PENDING` | Accepted and stored; processing has not started yet. | No |
    | `EXECUTING` | Processing has started. | No |
    | `PARTIALLY_COMPLETED` | Processing has finished, but only part of the instruction was completed. No further execution will occur for this instruction. | Yes |
    | `COMPLETED` | The financial effect of the instruction was recorded successfully; this does not imply market execution. | Yes |
    | `FAILED` | The instruction could not be completed. | Yes |

    `REJECTED` is not an instruction lifecycle state. It is used only in
    `POST /instructions/batch` results when an individual item is not accepted
    and therefore is never stored.

    Transitions:

    | From | To | Trigger |
    |---|---|---|
    | `PENDING` | `EXECUTING` | Processing starts. |
    | `EXECUTING` | `COMPLETED` | Processing finishes and the instruction is completed in full. |
    | `EXECUTING` | `PARTIALLY_COMPLETED` | Processing finishes after only part of the instruction could be completed; no further execution will occur. |
    | `PENDING`, `EXECUTING` | `FAILED` | A processing or business-rule failure prevents completion. |

    ## Plans

    A plan defines a set of assets and their target weights. This version
    of the API has no plan-discovery endpoint. A plan ID in a request must
    refer to an existing plan, otherwise `INVESTMENT_PLAN_NOT_FOUND` is returned.

    ## Errors

    - `POST /instructions/batch` returns **HTTP 400** only when the batch
      request itself is malformed. Validation and business-rule errors for an
      individual instruction are returned in that item's batch result with
      status `REJECTED` and an `error.code`. Clients must branch on `code`,
      not on the batch HTTP status.
    - JSON Schema violations map to specific codes where one exists:
      a missing `amount` for INVEST or DIVEST → `AMOUNT_REQUIRED`;
      an `amount` below 1 → `INVALID_AMOUNT`. Every other
      schema violation (malformed JSON, a wrong type, a missing required
      field, an unknown property, an unknown enum value) →
      `INVALID_REQUEST`.
    - On GET endpoints, an invalid path or query parameter (non-numeric
      or below 1, a malformed `date-time`, or `from` later than `to`)
      returns HTTP 400 with `INVALID_REQUEST`.
    - The gateway can return these responses on any endpoint: 401
      (missing or invalid credentials), 403 (the client may not access
      the requested investment account), 429 (too many requests),
      500 (unexpected error) and 503 (temporarily unavailable).
      Their bodies are not guaranteed to follow `ErrorResponse`. Retry 429
      and 503 with backoff. After a 500 or a timeout on
      `POST /instructions/batch`, the outcome of individual items may be
      unknown: reconcile accepted items with
      `GET /instructions/{instructionId}` (see *Retries and idempotency*).
    - `ErrorResponse` has no trace ID and no per-field details. When
      reporting a problem, include the `code`, the request timestamp (UTC)
      and the related `instructionId` or `investmentId`.

    ## Retries and idempotency

    `instructionId` is the idempotency key for each item in a batch. It must
    be **globally unique across all clients** and must never be reused, even
    after the instruction is terminal. `instructionBatchId` is a correlation
    identifier and is not the idempotency key.

    After a timeout or a 5xx on `POST /instructions/batch`, the client may
    resend the same batch with the same instruction payloads and the same
    `instructionId` values. For each item:

    - `PENDING`: the instruction was accepted by this submission and stored.
    - `REJECTED` with `DUPLICATE_INSTRUCTION`: an instruction with this ID
      already exists. The server does not check whether the payload is the
      same. Call `GET /instructions/{instructionId}`: if the returned details
      match the submitted item, an earlier attempt succeeded and nothing more
      is needed; otherwise the ID collides with another instruction and a new
      `instructionId` must be used.

    ## Known limitations of this version

    - Instructions have no creation or update timestamps.
    - No failure reason is exposed for `FAILED` instructions.
    - Instruction endpoints expose only instruction-level status; generated
      orders, trades, and per-asset execution details are intentionally not returned.
    - The investment transactions endpoint is not paginated.
    - There is no endpoint that lists the instructions of an investment
      account. Clients must keep the `instructionId`s they submit.

servers:
  - url: https://vestapi.emofid.com/api/v1
    description: Production
  - url: https://vestapi-sandbox.emofid.com/api/v1
    description: Sandbox

paths:

  /instructions/batch:
    post:
      operationId: submitInstructionBatch
      summary: Submit a batch of investment instructions
      description: |
        Submits one or more INVEST or DIVEST instructions in a single request.
        Each instruction is validated and processed independently; the failure
        or rejection of one instruction does not prevent the others from being
        accepted. A batch containing a single instruction is valid. See
        *Errors* and *Retries and idempotency* for submission and retry rules.

        The response always has HTTP status 207, with one result per
        submitted instruction, in the same order as the request. Check
        each result's `status` field rather than the HTTP status.

        HTTP 400 is only returned when the batch request itself is
        malformed (not a JSON array, or an empty one); it does not
        reflect the outcome of any individual instruction.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionBatchRequest'

            example:
              instructionBatchId: 600001
              sumInvest: 50000000
              sumDivest: 25000000
              instructions:

                - instructionId: 100001
                  investmentId: 200001
                  instructionType: INVEST
                  amount: 50000000
                  investmentPlanId: 300002

                - instructionId: 100002
                  investmentId: 200001
                  instructionType: DIVEST
                  amount: 25000000

      responses:

        '207':
          description: >
            Batch processed. Each instruction was validated and stored
            independently; check status on each result. A PENDING result
            means the instruction was stored and can be tracked with
            GET /instructions/{instructionId}. A REJECTED result means it was
            not stored; see its error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionBatchResponse'

              example:
                instructionBatchId: 600001
                results:

                  - instructionId: 100001
                    status: PENDING

                  - instructionId: 100002
                    status: REJECTED
                    error:
                      code: DUPLICATE_INSTRUCTION
                      message: Instruction with the specified instructionId already exists.

        '400':
          description: >
            The batch request itself is malformed. Covers schema
            validation errors of the request body, such as a missing or
            empty instructions array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INVALID_REQUEST
                message: instructions must be a non-empty array.

  /instructions/batch/{instructionBatchId}:
    get:
      operationId: getInstructionBatch
      summary: Get instruction batch status
      description: >
        Returns the current batch-level status. No generated order or execution
        detail is returned. An invalid instructionBatchId returns HTTP 400 with
        INVALID_REQUEST.

      parameters:

        - name: instructionBatchId
          in: path
          required: true
          description: Unique identifier of the instruction batch
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Instruction batch status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionBatchDetailsResponse'

              example:
                instructionBatchId: 600001
                status: COMPLETED

        '404':
          description: Instruction Batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INSTRUCTION_BATCH_NOT_FOUND
                message: Instruction batch with the specified instructionBatchId does not exist.

  /instructions/{instructionId}:
    get:
      operationId: getInstruction
      summary: Get instruction details and execution status
      description: >
        Returns the submitted instruction fields and its current instruction-level
        status. Generated orders, trades, and per-asset execution details are not
        returned. An invalid instructionId returns HTTP 400 with INVALID_REQUEST.

      parameters:

        - name: instructionId
          in: path
          required: true
          description: Unique identifier of the instruction
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Instruction details and current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionDetailsResponse'

              example:
                instructionId: 100001
                investmentId: 200001
                instructionType: INVEST
                amount: 50000000
                investmentPlanId: 300002
                status: COMPLETED

        '404':
          description: Instruction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INSTRUCTION_NOT_FOUND
                message: Instruction with the specified instructionId does not exist.


  /investments/{investmentId}:
    get:
      operationId: getInvestment
      summary: Get investment account details
      description: >
        Returns the investment account's default plan, cash balance,
        and current asset holdings. All monetary values are in Rial.
        An invalid investmentId returns HTTP 400 with INVALID_REQUEST.

      parameters:

        - name: investmentId
          in: path
          required: true
          description: Unique identifier of the investment account
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Investment account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentDetailsResponse'

              example:
                investmentId: 200001
                investmentPlanId: 300002
                cashBalance: 5000000
                investmentValue: 45100000
                assets:
                  - isin: IRTKMOFD0001
                    symbol: عیار
                    quantity: 1500
                    lastMarketPrice: 13400

                  - isin: IRT3TVAF0001
                    symbol: توان
                    quantity: 800
                    lastMarketPrice: 25000
                timestamp: '2026-09-27T10:15:00Z'

        '404':
          description: Investment account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INVESTMENT_NOT_FOUND
                message: The specified investment account does not exist.


  /investments/{investmentId}/transactions:
    get:
      operationId: getInvestmentTransactions
      summary: Get transactions for an investment account within a date range
      description: >
        Returns all transactions (deposits, withdrawals, buys and sells) of
        the investment account between the from and to timestamps (UTC),
        sorted by timestamp ascending. The response is not paginated.
        A missing or malformed from or to, from later than to, or an
        invalid investmentId returns HTTP 400 with INVALID_REQUEST.

      parameters:

        - name: investmentId
          in: path
          required: true
          description: Unique identifier of the investment account
          schema:
            type: integer
            format: int64
            minimum: 1

        - name: from
          in: query
          required: true
          description: >
            Start of the date range (inclusive), in UTC. Must not be later
            than to.
          schema:
            type: string
            format: date-time

        - name: to
          in: query
          required: true
          description: >
            End of the date range (inclusive), in UTC. Must not be earlier
            than from.
          schema:
            type: string
            format: date-time

      responses:

        '200':
          description: Transactions within the specified date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentTransactionHistoryResponse'

              example:
                investmentId: 200001
                from: '2026-09-01T00:00:00Z'
                to: '2026-09-27T23:59:59Z'
                transactions:
                  - transactionId: 500001
                    type: DEPOSIT
                    amount: 20000000
                    timestamp: '2026-09-26T08:00:00Z'

                  - transactionId: 500002
                    type: BUY
                    amount: 13300000
                    timestamp: '2026-09-27T09:30:00Z'
                    trade:
                      isin: IRTKMOFD0001
                      symbol: عیار
                      symbolName: صندوق عیار مفید
                      quantity: 1000
                      price: 13300

                  - transactionId: 500003
                    type: WITHDRAW
                    amount: 5000000
                    timestamp: '2026-09-27T12:00:00Z'

        '404':
          description: Investment account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INVESTMENT_NOT_FOUND
                message: The specified investment account does not exist.


components:

  schemas:

    InstructionRequest:
      type: object
      additionalProperties: false

      required:
        - instructionId
        - investmentId
        - instructionType

      properties:

        instructionId:
          type: integer
          format: int64
          minimum: 1
          description: >
            Client-generated unique identifier of the instruction. It acts
            as the idempotency key.

            It must be globally unique across all clients. Reusing an
            existing instructionId is not allowed and returns
            DUPLICATE_INSTRUCTION, whatever the payload. After a
            DUPLICATE_INSTRUCTION on a retry, call
            GET /instructions/{instructionId} to check whether the
            original request succeeded.

        investmentId:
          type: integer
          format: int64
          minimum: 1
          description: >
            Identifier of the investment account.

            For DIVEST instructions, the investment account
            must already exist.

            For INVEST instructions, a new investment account is created with
            this identifier if it does not exist; investmentPlanId is then
            required.

        instructionType:
          $ref: '#/components/schemas/InstructionType'

        amount:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          description: >
            Monetary amount of the instruction, in Rial.

            INVEST (required): cash deposit to record in the investment account.

            DIVEST (required): withdrawal/debt to record in the investment account. It must not exceed
            the value available to sell, otherwise the instruction becomes
            FAILED.


        investmentPlanId:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          description: >
            Default investment plan of the investment account.

            When provided, this plan becomes the default plan of the
            investment account.

            When creating a new investment account, investmentPlanId is required.

            For an existing investment account, if investmentPlanId is omitted,
            the account's current default plan is used. If no default plan exists,
            INVEST is rejected with INVESTMENT_PLAN_REQUIRED.

      oneOf:

        - properties:
            instructionType:
              enum:
                - INVEST
          required:
            - amount

        - properties:
            instructionType:
              enum:
                - DIVEST
          required:
            - amount


    InstructionDetailsResponse:
      type: object
      additionalProperties: false
      description: >
        Submitted instruction fields plus the current instruction-level status.
        This schema intentionally does not expose generated orders, trades, or
        per-asset execution details.

      required:
        - instructionId
        - investmentId
        - instructionType
        - status

      properties:

        instructionId:
          type: integer
          format: int64

        investmentId:
          type: integer
          format: int64

        instructionType:
          $ref: '#/components/schemas/InstructionType'

        amount:
          type: integer
          nullable: true
          format: int64
          description: >
            Total monetary amount of the instruction, in Rial, as submitted.

        investmentPlanId:
          type: integer
          nullable: true
          format: int64
          description: investmentPlanId as submitted; null when not provided.

        status:
          $ref: '#/components/schemas/InstructionStatus'


    InstructionBatchDetailsResponse:
      type: object
      additionalProperties: false

      required:
        - instructionBatchId
        - status

      properties:

        instructionBatchId:
          type: integer
          format: int64

        status:
          $ref: '#/components/schemas/InstructionStatus'

    InstructionBatchRequest:
      type: object
      additionalProperties: false

      required:
        - instructionBatchId
        - instructions

      properties:

        instructionBatchId:
          type: integer
          format: int64
          minimum: 1
          description: >
            Client-generated unique identifier of the batch request. It is
            echoed back in the response, for correlating the request with
            its result and for logging or support purposes. It does not
            affect deduplication: each instruction's own instructionId is
            still the idempotency key, so resubmitting the same batch
            (whether under the same or a different instructionBatchId) is
            safe.

        instructions:
          type: array
          minItems: 1
          description: >
            Instructions to submit. Each item is validated independently.
            A batch may contain one or more instructions.
          items:
            $ref: '#/components/schemas/InstructionRequest'


    InstructionBatchResponse:
      type: object
      additionalProperties: false

      required:
        - instructionBatchId
        - results

      properties:

        instructionBatchId:
          type: integer
          format: int64
          description: instructionBatchId as submitted.

        results:
          type: array
          description: >
            One result per submitted instruction, in the same order as
            the request.
          items:
            $ref: '#/components/schemas/InstructionBatchResult'


    InstructionBatchResult:
      type: object
      additionalProperties: false
      description: >
        Result of submitting one instruction from the batch. status is
        always PENDING or REJECTED here: PENDING means the instruction was
        accepted and stored and can be tracked with
        GET /instructions/{instructionId}; REJECTED means it was not stored,
        and error is present with the reason.

      required:
        - instructionId
        - status

      properties:

        instructionId:
          type: integer
          format: int64
          description: instructionId of the corresponding instruction in the request.

        status:
          $ref: '#/components/schemas/InstructionSubmissionStatus'

        error:
          $ref: '#/components/schemas/ErrorResponse'

      oneOf:

        - properties:
            status:
              enum:
                - PENDING
          not:
            required:
              - error

        - properties:
            status:
              enum:
                - REJECTED
          required:
            - error


    InvestmentDetailsResponse:
      type: object
      additionalProperties: false

      required:
        - investmentId
        - investmentPlanId
        - cashBalance
        - investmentValue
        - assets
        - timestamp

      properties:

        investmentId:
          type: integer
          format: int64

        investmentPlanId:
          type: integer
          nullable: true
          format: int64
          description: >
            Default investment plan of the investment account.

            May be null if no plan has been assigned. Accounts created
            through this API always have a default plan, because
            investmentPlanId is required at creation. INVEST
            instructions for an account without a default plan must provide
            a plan.

        cashBalance:
          type: integer
          format: int64
          minimum: 0
          description: >
            Cash balance available in the investment account, in Rial.

        investmentValue:
          type: integer
          format: int64
          minimum: 0
          description: >
            Total value of the investment account, in Rial. Equal to the cash
            balance plus the market value (quantity × lastMarketPrice) of all
            asset holdings.

        assets:
          type: array
          description: >
            Current asset holdings of the investment account.
          items:
            $ref: '#/components/schemas/InvestmentAsset'

        timestamp:
          type: string
          format: date-time
          description: >
            Date and time this valuation was generated, in UTC.


    InvestmentAsset:
      type: object
      additionalProperties: false

      required:
        - isin
        - symbol
        - quantity
        - lastMarketPrice

      properties:

        isin:
          type: string
          description: ISIN code of the trading symbol.
          example: IRTKMOFD0001

        symbol:
          type: string
          description: Trading symbol (short code).
          example: عیار

        quantity:
          type: integer
          format: int64
          minimum: 0
          description: >
            Number of units of the symbol currently held.

        lastMarketPrice:
          type: integer
          format: int64
          minimum: 0
          description: >
            Last known market price per unit of the symbol, in Rial.


    Trade:
      type: object
      additionalProperties: false

      required:
        - quantity
        - price
        - timestamp

      properties:

        quantity:
          type: integer
          format: int64
          minimum: 1
          description: Number of units traded.

        price:
          type: integer
          format: int64
          minimum: 1
          description: Price per unit for this trade, in Rial.

        timestamp:
          type: string
          format: date-time
          description: Date and time the trade was executed, in UTC.


    InvestmentTransactionHistoryResponse:
      type: object
      additionalProperties: false

      required:
        - investmentId
        - from
        - to
        - transactions

      properties:

        investmentId:
          type: integer
          format: int64

        from:
          type: string
          format: date-time
          description: Start of the requested date range (inclusive), in UTC.

        to:
          type: string
          format: date-time
          description: End of the requested date range (inclusive), in UTC.

        transactions:
          type: array
          description: >
            Transactions of the investment account within the requested
            date range, sorted by timestamp ascending.
          items:
            $ref: '#/components/schemas/InvestmentTransaction'


    InvestmentTransaction:
      type: object
      additionalProperties: false
      description: >
        A single transaction of an investment account. trade is present
        only when type is BUY or SELL, and absent for DEPOSIT and WITHDRAW.

      required:
        - transactionId
        - type
        - amount
        - timestamp

      properties:

        transactionId:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the transaction.

        type:
          $ref: '#/components/schemas/TransactionType'

        amount:
          type: integer
          format: int64
          minimum: 1
          description: >
            Monetary value of the transaction, in Rial. For BUY and SELL it
            equals trade.quantity × trade.price.

        timestamp:
          type: string
          format: date-time
          description: Date and time the transaction took place, in UTC.

        trade:
          $ref: '#/components/schemas/TransactionTrade'

      oneOf:

        - properties:
            type:
              enum:
                - BUY
                - SELL
          required:
            - trade

        - properties:
            type:
              enum:
                - DEPOSIT
                - WITHDRAW
          not:
            required:
              - trade


    TransactionTrade:
      type: object
      additionalProperties: false
      description: Trade details of a BUY or SELL transaction.

      required:
        - isin
        - symbol
        - symbolName
        - quantity
        - price

      properties:

        isin:
          type: string
          description: ISIN code of the trading symbol.
          example: IRTKMOFD0001

        symbol:
          type: string
          description: Trading symbol (short code).
          example: عیار

        symbolName:
          type: string
          description: Full name of the trading symbol.
          example: صندوق عیار مفید

        quantity:
          type: integer
          format: int64
          minimum: 1
          description: Number of units traded.

        price:
          type: integer
          format: int64
          minimum: 1
          description: Price per unit for this trade, in Rial.


    TransactionType:
      type: string
      description: |
        - `DEPOSIT`: cash added to the account.
        - `WITHDRAW`: cash taken out of the account.
        - `BUY`: units of an asset bought.
        - `SELL`: units of an asset sold.
      enum:
        - DEPOSIT
        - WITHDRAW
        - BUY
        - SELL


    InstructionType:
      type: string
      description: |
        - `INVEST`: record a cash deposit in the investment account.
        - `DIVEST`: record a withdrawal/debt in the investment account.
      enum:
        - INVEST
        - DIVEST


    InstructionStatus:
      type: string
      description: |
        Instruction-level processing status.

        - `PENDING`: accepted and stored; processing has not started yet.
        - `EXECUTING`: processing has started.
        - `PARTIALLY_COMPLETED`: processing has finished, but only part of
          the instruction was completed. No further execution will occur for
          this instruction. This is a terminal status.
        - `COMPLETED`: the financial effect was recorded successfully in full.
          This is a terminal status and does not imply market execution.
        - `FAILED`: the instruction could not be completed. This is a terminal
          status.

        These statuses are intentionally instruction-level. The API does not
        expose the generated orders or their individual execution states.
      enum:
        - PENDING
        - EXECUTING
        - PARTIALLY_COMPLETED
        - COMPLETED
        - FAILED

    InstructionSubmissionStatus:
      type: string
      description: |
        Result of submitting an individual item in a batch.

        - `PENDING`: accepted and stored for asynchronous processing.
        - `REJECTED`: not accepted and never stored.
      enum:
        - PENDING
        - REJECTED

    ErrorResponse:
      type: object
      additionalProperties: false

      required:
        - code
        - message

      properties:

        code:
          $ref: '#/components/schemas/ErrorCode'

        message:
          type: string
          description: >
            Human-readable description of the error. Not stable; do not
            parse it.


    ErrorCode:
      type: string
      description: |
        Machine-readable error code. Clients must branch on this value
        rather than on the HTTP status.

        - `INVALID_REQUEST` (400): the request does not match the schema,
          or a path or query parameter is invalid, and no more specific
          code applies.
        - `AMOUNT_REQUIRED` (400): `amount` is missing for INVEST or DIVEST.
        - `INVALID_AMOUNT` (400): `amount` is below 1.
        - `DUPLICATE_INSTRUCTION` (400): `instructionId` already exists.
          See *Retries and idempotency*.
        - `INVESTMENT_PLAN_NOT_FOUND` (400): `investmentPlanId` does not
          refer to an existing plan.
        - `INVESTMENT_PLAN_REQUIRED` (400): no plan could be resolved,
          either because an INVEST creates a new account without
          `investmentPlanId`, or because the account has no default plan.
        - `INVESTMENT_NOT_FOUND` (400 on POST, 404 on GET): the investment
          account does not exist.
        - `INSTRUCTION_NOT_FOUND` (404): the instruction does not exist.
      enum:
        - DUPLICATE_INSTRUCTION
        - INVESTMENT_PLAN_NOT_FOUND
        - INVESTMENT_NOT_FOUND
        - INVESTMENT_PLAN_REQUIRED
        - AMOUNT_REQUIRED
        - INVALID_AMOUNT
        - INVALID_REQUEST
        - INSTRUCTION_NOT_FOUND
        - INSTRUCTION_BATCH_NOT_FOUND
